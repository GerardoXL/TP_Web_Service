<div class="busqueda-container mt-4">
    <input [(ngModel)]="artista" type="text" placeholder="Buscar cancion o Artista">
    <button (click)="buscarCancion(artista)" class="btn btn-secondary">Buscar</button>
</div>
<div class="row">
    <div class="col-12 col-md-3 col-sm-6 mt-5 card-container" *ngFor="let c of canciones">
        <div class="card h-100" style="width: 18rem;">
            <img [src]="c.album.cover_medium" class="card-img-top" alt="...">
            <div class="card-body">
                <h5 class="card-title">{{c.title}} {{c.artist.name}}</h5>
                <audio class="w-100" [src]="c.preview" controls></audio>
                
            </div>
        </div>
    </div>
</div>
